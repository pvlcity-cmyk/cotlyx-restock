name: check

# Lancé par Cotlyx (workflow_dispatch) selon le créneau horaire. Aucun planning GitHub ici.
# Une seule exécution à la fois ; celles qui arrivent attendent leur tour (jamais annulée en cours).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: restock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Relevé
        run: node checker/check.mjs
