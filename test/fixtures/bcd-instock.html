<!-- JSON-LD PrestaShop : type sans guillemets, comme les fiches BCD -->
<html><head><script type=application/ld+json>{
    "@context": "http://schema.org/",
    "@type": "Product",
    "name": "Mini Tin exemple",
    "image": "https://www.bcd-jeux.fr/img/exemple.jpg",
    "offers": {
        "@type": "Offer",
        "priceCurrency": "EUR",
        "price": "49.9",
        "availability": "http://schema.org/InStock",
        "seller": { "@type": "Organization", "name": "BCD Jeux" }
    }
}</script></head><body></body></html>
